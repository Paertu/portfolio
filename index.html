<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emily Jade Pärt's Portfolio</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <video autoplay muted loop id="background-video">
        <source src="src/pics/background.mp4" type="video/mp4">
    </video>
    <div class="steam-profile-background">
        <div class="profile-header">
            <div class="profile-pfp-container">
                <div class="profile-picture">
                    <img src="src/pics/HAoCRbEa0AAJ-JU.jpg" alt="Artist Credit:" width="164" height="164">
                </div>
                <div class="profile-frame">
                    <img src="src/pics/frame.png" alt="frame">
                </div>    
     
            </div>
  
            <div class="persona-container">
                <h1 class="persona-name">Emily Jade Pärt</h1>
                <div class="real-name-flag"> 
                    <p class="profile-location">Harjumaa, Estonia</p>
                    <img class="country-flag" src="src/pics/ee.gif">
                </div>
                <p class="profile-summary">Junior Software Developer, 3D Blender animator. Previously developer @ EBS</p>
            </div>

            <div class="badge-info-container">
                <div class="badge-background">
                    <img src="src/pics/steamyears21_80.png">
                    <div class="badge-info-text">
                        <p>Years of Age</p>
                        <p>19/02/2005</p>
                    </div>
                </div>
            </div>   
        </div>
        <div class="profile-content"> 
            <div class="about-section">
                <div class="customization-container">
                    <div class="customization-header">
                        <p class="customization-header-text">My Projects</p>
                    </div>
                </div>
            </div>
            <div class="profile-sidebar">
                <p>Currently Online</p>
            </div>
        </div>
    </div>
</body>
</html>
